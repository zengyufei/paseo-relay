name: Standalone release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build standalone binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: 29.0.3
          elixir-version: 1.20.2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install --yes xz-utils p7zip-full
      - name: Validate tag version
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*version: "\([^"]*\)",/\1/p' mix.exs | head -n 1)
          test "${GITHUB_REF_NAME}" = "v${version}"
      - run: node scripts/validate-standalone-release.mjs
      - run: bash scripts/build-standalone.sh
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-binaries
          path: dist/
          if-no-files-found: error

  smoke:
    name: smoke ${{ matrix.name }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            artifact: linux-x86_64
            shell: bash
            full: true
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            artifact: linux-aarch64
            shell: bash
            full: false
          - name: windows-x86_64
            runner: windows-2022
            artifact: windows-x86_64.exe
            shell: pwsh
            full: false
          - name: macos-x86_64
            runner: macos-15-intel
            artifact: macos-x86_64
            shell: bash
            full: false
          - name: macos-aarch64
            runner: macos-15
            artifact: macos-aarch64
            shell: bash
            full: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: standalone-binaries
          path: dist
      - uses: actions/setup-node@v4
        if: matrix.full
        with:
          node-version: 22
      - name: Smoke Unix binary
        if: matrix.shell == 'bash'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          mode=health
          if [[ "${{ matrix.full }}" == "true" ]]; then mode=relay-load; fi
          bash scripts/smoke-standalone.sh "dist/paseo-relay-v${version}-${{ matrix.artifact }}" "${mode}"
      - name: Smoke Windows binary
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          scripts/smoke-standalone.ps1 -Binary "dist/paseo-relay-v$version-${{ matrix.artifact }}"

  publish:
    name: publish GitHub release
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: standalone-binaries
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes \
            --notes "Standalone binaries are unsigned. macOS Gatekeeper and Windows SmartScreen may require an explicit local security exception."
